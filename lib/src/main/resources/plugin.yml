name: MyPaperPlugin
version: 0.0.1
main: org.adw39.mypaperplugin.MyPaperPlugin
description: An example plugin
author: nikki
website: https://adw39.org
api-version: '1.21.0'
commands:
  test:
    description: サーバーテスト用のコマンド
    usage: "/test <arg>"
    permission: org.adw39.mypaperplugin.test
  eyesmash:
    description: 視点先のブロックを破壊します
    usage: "/eyesmash <distance>"
    permission: org.adw39.mypaperplugin.eyesmash
  eyeexplosion:
    description: 視点先のブロックを破壊します
    usage: "/eyesmash <distance>"
    permission: org.adw39.mypaperplugin.eyesmash
  ikkatuhakai:
    description: 視点先のブロックを破壊します
    usage: "/ikkatuhakai (add <block id> | del <block id> | list)"
    permission: org.adw39.mypaperplugin.ikkatuhakai
  exVector:
    description: vector検証用
    usage: "/exvector (TAB)"
    permission: org.adw39.mypaperplugin.exvector
